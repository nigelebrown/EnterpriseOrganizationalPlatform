[project]
name = "jcf-enterprise-organizational-platform"
version = "0.1.0"
description = "JCF-EMP modular enterprise management platform with standardized data and governed APIs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "PyJWT[crypto]>=2.9,<3",
  "pyodbc>=5.1,<6",
  "python-multipart>=0.0.18,<1",
  "openpyxl>=3.1,<4",
  "alembic>=1.14,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=5,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jcf_platform*"]

[tool.setuptools.package-data]
jcf_platform = ["admin.html", "admin.js", "admin.css", "reconciliation.js"]
